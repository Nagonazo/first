<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>AR Example</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.rawgit.com/jeromeetienne/ar.js/master/aframe/build/aframe-ar.js"></script>
    <style>
      body, html {
        margin: 0;
        padding: 0;
        overflow: hidden;
      }
      .hud-text {
        position: absolute;
        top: 10px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 24px;
        color: white;
        background: rgba(0, 0, 0, 0.5);
        padding: 10px;
        border-radius: 5px;
        z-index: 1000;
      }
    </style>
    <!-- ★ここからJavaScriptを追加★ -->
  <script>
    AFRAME.registerComponent('look-at-camera', {
    tick: function () {
      var cameraEl = this.el.sceneEl.camera;
      if (!cameraEl) return;

      var obj = this.el.object3D;
      var camObj = cameraEl.el.object3D;

      // 1. カメラの位置を向く
      obj.lookAt(camObj.position);

      // 2. カメラの回転（Z軸）に合わせて文字の上方向を画面上部に合わせる
      obj.quaternion.multiplyQuaternions(camObj.quaternion, obj.quaternion);
      
      // 必要に応じて画面に対する傾き補正を保持
      var euler = new THREE.Euler().setFromQuaternion(obj.quaternion, 'YXZ');
      euler.z = camObj.rotation.z; // カメラの傾きに同調させる
      obj.quaternion.setFromEuler(euler);
    }
   });
  </script>
  <!-- ★ここまで★ -->
  </head>
  <body>
    <!-- メッセージ表示エリア -->
    <div class="hud-text">Hiroマーカーを探せ</div>

    <!-- AR.jsのシーン -->
    <a-scene embedded arjs="debugUIEnabled: false">
      <a-marker preset="hiro">
        <a-text value="GAME START" color="red" position="0 0.5 0" scale="3 3 3" align="center" look-at-camera></a-text>
      </a-marker>
      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
